# Ultra plan (until 2026-11-07): 75,000 requests per day, 450 per minute,
# both read from the x-ratelimit headers the server sends.
api_football:
  plan: ultra
  quota:
    daily_limit: 75000
    per_minute_limit: 450
    safety_margin: 500

leagues:
  - key: epl
    name: Premier League
    api_football_id: 39
    transfermarkt_id: GB1
  - key: super_lig
    name: Süper Lig
    api_football_id: 203
    transfermarkt_id: TR1
  # Added for history and for the clubs that buy from mid table: the other top
  # four, three feeder leagues and the Championship. Ids checked against the API.
  - key: la_liga
    name: La Liga
    api_football_id: 140
    transfermarkt_id: ES1
  - key: bundesliga
    name: Bundesliga
    api_football_id: 78
    transfermarkt_id: L1
  - key: serie_a
    name: Serie A
    api_football_id: 135
    transfermarkt_id: IT1
  - key: ligue_1
    name: Ligue 1
    api_football_id: 61
    transfermarkt_id: FR1
  - key: eredivisie
    name: Eredivisie
    api_football_id: 88
    transfermarkt_id: NL1
  - key: primeira_liga
    name: Primeira Liga
    api_football_id: 94
    transfermarkt_id: PO1
  - key: belgian_pro_league
    name: Belgian Pro League
    api_football_id: 144
    transfermarkt_id: BE1
  - key: championship
    name: Championship
    api_football_id: 40
    transfermarkt_id: GB2

backfill:
  seasons: all
  endpoints: [players]
  # On Ultra every season should be served; a refusal means something is wrong.
  stop_on_plan_error: true
