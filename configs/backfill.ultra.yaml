backfill:
  seasons: all
  endpoints: [players]
  # On Ultra every season should be served; a refusal means something is wrong.
  stop_on_plan_error: true

# Generated scout reports (prompt 19, `scout reports`, after `scout lists`):
# Claude Haiku 5.5 writes, Claude Sonnet 5.5 judges a weekly sample, both
# through the Message Batches API. The cap counts every token one run may be
# billed for (writer and judge, input, cache writes and reads, output);
# requests that could pass it are not sent. Rates in USD per million tokens.
reports_text:
  writer_model: claude-haiku-5-5
  judge_model: claude-sonnet-5-5
  judge_sample: 50
  retries: 2
  max_tokens_per_run: 30000000
  max_run_minutes: 100
  prices:
    claude-haiku-5-5: {input: 0.10, output: 0.50}
    claude-sonnet-5-5: {input: 2.00, output: 10.00}

# The Ask tab (prompt 20, decision 11): the Function URL of the ScoutChat
# stack (its ChatUrl output, docs/DEPLOY.md). Empty until the stack is
# deployed; the tab then says the chat is not switched on.
chat:
  url: null
  site_url: http://scout-site-098499087060.s3-website.eu-central-1.amazonaws.com/
