<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>__TITLE__</title>
<style>
:root {
  --bg: #f7f7f5;
  --panel: #ffffff;
  --ink: #1d1f23;
  --muted: #5f6570;
  --faint: #8a909a;
  --line: #e2e3e0;
  --accent: #1f5fbf;
  --accent-soft: #e6eefb;
  --good: #1d7a46;
  --good-soft: #e3f3ea;
  --warn: #9a5b00;
  --warn-soft: #fbf0dc;
  --risk: #b3261e;
  --risk-soft: #fbe7e5;
  --row-hover: #fafaf8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a;
    --panel: #1d2024;
    --ink: #e8e9eb;
    --muted: #a5abb4;
    --faint: #7d838c;
    --line: #2e3238;
    --accent: #7fb0ff;
    --accent-soft: #1f2d44;
    --good: #6fd19a;
    --good-soft: #17301f;
    --warn: #f0b85a;
    --warn-soft: #33270f;
    --risk: #ff8f86;
    --risk-soft: #3a1c1a;
    --row-hover: #222529;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a;
  --panel: #1d2024;
  --ink: #e8e9eb;
  --muted: #a5abb4;
  --faint: #7d838c;
  --line: #2e3238;
  --accent: #7fb0ff;
  --accent-soft: #1f2d44;
  --good: #6fd19a;
  --good-soft: #17301f;
  --warn: #f0b85a;
  --warn-soft: #33270f;
  --risk: #ff8f86;
  --risk-soft: #3a1c1a;
  --row-hover: #222529;
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
header h1 { font-size: 24px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.01em; }
header p { margin: 0; color: var(--muted); }
a { color: var(--accent); }
.howto {
  margin: 18px 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
}
.howto summary { cursor: pointer; padding: 12px 16px; font-weight: 600; }
.howto .body { padding: 0 16px 14px; }
.howto ul { margin: 0; padding-left: 18px; }
.howto li { margin: 6px 0; max-width: 92ch; }
.tabs { display: flex; gap: 6px; margin: 18px 0 10px; flex-wrap: wrap; }
.tab, .seg button {
  font: inherit;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
}
.tab[aria-selected="true"], .seg button[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--panel);
}
.tab .n { opacity: .75; font-variant-numeric: tabular-nums; }
.controls {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  box-shadow: var(--shadow);
}
.controls label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.controls input, .controls select {
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
  min-width: 0;
}
.controls .search { grid-column: span 2; }
.controls .ages { display: flex; gap: 6px; }
.controls .ages input { width: 100%; }
.controls .checks { display: flex; flex-direction: column; gap: 4px; justify-content: flex-end; font-size: 13px; color: var(--ink); }
.controls .checks label { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); }
.controls .actions { display: flex; align-items: flex-end; gap: 6px; }
.controls button {
  font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--bg);
  color: var(--ink); border-radius: 6px; padding: 6px 10px; cursor: pointer; white-space: nowrap;
}
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
.status { color: var(--muted); font-size: 13px; margin: 12px 2px 8px; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
th {
  text-align: left; font-size: 12px; font-weight: 600; color: var(--muted);
  padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: bottom;
}
th button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
th[aria-sort="ascending"] button::after { content: " \25B2"; }
th[aria-sort="descending"] button::after { content: " \25BC"; }
td { padding: 9px 10px 3px; vertical-align: top; font-variant-numeric: tabular-nums; }
tbody.row { border-top: 1px solid var(--line); }
tbody.row:hover { background: var(--row-hover); }
tr.why td { padding: 0 10px 10px; color: var(--muted); font-size: 13px; }
.name { font-weight: 600; }
.meta { color: var(--muted); font-size: 12.5px; }
.num { white-space: nowrap; }
.small { display: block; color: var(--faint); font-size: 11.5px; }
.blank { color: var(--faint); font-size: 12.5px; }
.badge {
  display: inline-block; font-size: 11px; font-weight: 600; border-radius: 999px;
  padding: 1px 7px; margin-left: 6px; vertical-align: 1px; white-space: nowrap;
}
.badge.rising { background: var(--good-soft); color: var(--good); }
.badge.loan, .badge.stale { background: var(--warn-soft); color: var(--warn); }
.badge.moved { background: var(--accent-soft); color: var(--accent); }
.flags { margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
.flags li { color: var(--risk); }
.flags li + li { margin-top: 2px; }
.none { color: var(--faint); font-size: 12.5px; }
.chance { font-weight: 600; }
.more { display: block; margin: 14px auto 0; font: inherit; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
details.dict { margin-top: 22px; }
details.dict summary { cursor: pointer; font-weight: 600; }
details.dict dl { margin: 10px 0 0; }
details.dict dt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; margin-top: 8px; }
details.dict dd { margin: 2px 0 0; color: var(--muted); max-width: 92ch; }
.link {
  font: inherit; font-size: 12px; background: none; border: 0; padding: 0; margin-top: 3px;
  color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
}
tr.sim td { padding: 0 10px 12px; }
.simbox { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.simbox h3, #sim-out h3 { font-size: 13px; margin: 0 0 6px; }
.report { margin: 0 0 12px; }
.report p { margin: 0 0 4px; max-width: 80ch; font-size: 14px; line-height: 1.5; }
.report .small { display: block; }
.report .sofar { margin-top: 8px; }
.simlist { margin: 0 0 6px; padding-left: 22px; }
.simlist li { margin: 4px 0; }
.simlist .meta { display: inline; }
.controls .mode { grid-column: 1 / -1; margin: 0; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.suggest button {
  font: inherit; font-size: 13px; text-align: left; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer;
}
#sim-out { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); }
#sim-out:empty { display: none; }
#sim-out .query { color: var(--muted); margin: 0 0 10px; }
.note { color: var(--muted); font-size: 13px; max-width: 100ch; }
.label { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 9px 12px; font-weight: 600; font-size: 13.5px; max-width: 100ch; margin: 0 0 12px; }
.pair { display: flex; gap: 4px 14px; flex-wrap: wrap; margin-top: 2px; font-size: 13px; }
.pair b { font-variant-numeric: tabular-nums; }
.traits { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 7px; }
.traits li { display: grid; grid-template-columns: 11em 90px 2.2em minmax(0, 1fr); gap: 2px 10px; align-items: baseline; font-size: 13px; }
.traits .bar { height: 6px; background: var(--line); border-radius: 3px; position: relative; overflow: hidden; align-self: center; }
.traits .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
.traits b { font-variant-numeric: tabular-nums; text-align: right; }
.traits .why { color: var(--muted); }
.tag { display: inline-block; font-size: 11.5px; color: var(--warn); background: var(--warn-soft); border-radius: 5px; padding: 1px 6px; margin-left: 6px; }
#ar-out, #ar-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); margin: 0 0 12px; }
#ar-out:empty, #ar-card:empty { display: none; }
#ar-out h3, #ar-card h3 { font-size: 13px; margin: 0 0 6px; }
#ar-card .query { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
#ar-card .sources { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
.credit img, footer img.logo { height: 26px; vertical-align: middle; background: #fff; padding: 3px 6px; border-radius: 6px; margin-right: 8px; }
.ask-line { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; max-width: 100ch; }
.explore { align-self: center; color: var(--muted); font-size: 13px; margin-left: 10px; padding-left: 12px; border-left: 1px solid var(--line); }
.welcome { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); margin: 0 0 12px; max-width: 100ch; }
.welcome h2 { font-size: 18px; margin: 0 0 6px; }
.welcome p { margin: 6px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.chips button {
  font: inherit; font-size: 14px; text-align: left; border: 1px solid var(--accent); background: var(--accent-soft);
  color: var(--accent); border-radius: 999px; padding: 7px 14px; cursor: pointer; max-width: 100%;
}
.chips button:disabled { opacity: .5; cursor: wait; }
.chips.follow { margin: 10px 0 0; }
.chips.follow button { font-size: 13px; padding: 5px 12px; }
#ask-log { display: grid; gap: 10px; margin: 0 0 12px; }
.msg { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow); max-width: 100ch; }
.msg.you { background: var(--accent-soft); border-color: transparent; justify-self: end; }
.msg .who { font-size: 11.5px; color: var(--faint); margin-bottom: 3px; }
.msg p { margin: 0 0 8px; }
.msg p:last-child { margin-bottom: 0; }
.msg.capped { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
details.from { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; font-size: 13px; }
details.from summary { cursor: pointer; color: var(--muted); }
details.from h4 { font-size: 12.5px; margin: 10px 0 2px; }
details.from .args { color: var(--faint); margin: 0 0 4px; }
details.from ol { margin: 4px 0; padding-left: 20px; }
details.from li { margin: 3px 0; }
dl.kv { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; }
dl.kv dt { color: var(--faint); }
dl.kv dd { margin: 0; }
.kv .k { color: var(--faint); }
#ask-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
#ask-form textarea { font: inherit; width: 100%; min-height: 3.2em; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); color: var(--ink); }
#ask-form button { font: inherit; border: 1px solid var(--accent); background: var(--accent); color: var(--panel); border-radius: 8px; padding: 8px 16px; cursor: pointer; }
#ask-form button:disabled { opacity: .55; cursor: wait; }
#ask-count { font-size: 12px; color: var(--faint); grid-column: 1 / -1; }
footer { margin-top: 28px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }
footer p { margin: 6px 0; max-width: 100ch; }
@media (max-width: 760px) {
  .wrap { padding: 16px 16px 40px; }
  header h1 { font-size: 21px; }
  .explore { flex-basis: 100%; margin: 4px 0 0; padding: 0; border: 0; }
  .chips button { width: 100%; }
  #ask-form { grid-template-columns: 1fr; }
  .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .controls input, .controls select { width: 100%; }
  .controls input[type="checkbox"] { width: auto; }
  .controls .actions { grid-column: 1 / -1; }
  .controls .search { grid-column: 1 / -1; }
  table, thead, tbody, tr, td { display: block; }
  table { border: 0; background: none; }
  thead { display: none; }
  tbody.row {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    margin: 0 0 10px; padding: 6px 0 2px; box-shadow: var(--shadow);
  }
  tbody.row:hover { background: var(--panel); }
  tr.main { display: grid; grid-template-columns: 1fr 1fr; }
  tr.main td { padding: 6px 12px; }
  tr.main td.player, tr.main td.wide { grid-column: 1 / -1; }
  tr.main td[data-label]::before {
    content: attr(data-label); display: block; font-size: 11px; color: var(--faint); margin-bottom: 1px;
  }
  tr.why td { padding: 2px 12px 10px; }
  .traits li { grid-template-columns: minmax(0, 1fr) 70px 2.2em; }
  .traits .why { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Scouting lists</h1>
    <p id="subtitle"></p>
  </header>

  <details class="howto" id="howto" open>
    <summary>How to read this: calibrated odds from past seasons, not predictions beyond the market</summary>
    <div class="body"><ul id="howto-list"></ul></div>
  </details>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-ask" data-tab="ask">Ask</button>
    <span class="explore">Explore the data:</span>
    <button class="tab" role="tab" id="tab-candidates" data-tab="candidates">Candidates <span class="n"></span></button>
    <button class="tab" role="tab" id="tab-bargains" data-tab="bargains">Bargains <span class="n"></span></button>
    <button class="tab" role="tab" id="tab-similar" data-tab="similar">Similar players</button>
    <button class="tab" role="tab" id="tab-greats" data-tab="greats">Measured greats</button>
    <button class="tab" role="tab" id="tab-archetypes" data-tab="archetypes">Archetypes</button>
  </div>

  <div id="tables">

  <div class="controls" id="controls">
    <label class="search">Search player or club
      <input type="search" id="q" placeholder="for example Bellingham, Como" autocomplete="off">
    </label>
    <label>Position <select id="position"></select></label>
    <label>League <select id="league"></select></label>
    <label>Age
      <span class="ages">
        <input type="number" id="age-min" inputmode="numeric" min="14" max="46" placeholder="from">
        <input type="number" id="age-max" inputmode="numeric" min="14" max="46" placeholder="to">
      </span>
    </label>
    <label>Flags <select id="flag"></select></label>
    <label>Sort by <select id="sort"></select></label>
    <div class="checks" id="checks"></div>
    <div class="actions">
      <button type="button" id="dir" title="Change the sort direction">Reverse order</button>
      <button type="button" id="reset">Clear filters</button>
    </div>
  </div>
  <div class="seg" id="lists" hidden>
    <button type="button" data-list="prime">Prime, 29 and under <span class="n"></span></button>
    <button type="button" data-list="experienced">Experienced, 30 to 33 <span class="n"></span></button>
  </div>

  <p class="status" id="status" aria-live="polite"></p>
  <table id="table">
    <thead><tr id="head"></tr></thead>
  </table>
  <button type="button" class="more" id="more" hidden>Show 50 more</button>

  <details class="dict" id="dict">
    <summary>What each column means</summary>
    <dl id="dict-list"></dl>
  </details>
  </div>

  <section id="similar" hidden>
    <div class="controls">
      <div class="seg mode" id="sim-mode">
        <button type="button" data-mode="now" aria-pressed="true">Plays like him now</button>
        <button type="button" data-mode="age" aria-pressed="false">Looks like he did at an age</button>
      </div>
      <label class="search">Player
        <input type="search" id="sim-q" placeholder="for example Lamine Yamal, Rodri" autocomplete="off">
      </label>
      <label class="age-only" hidden>At age
        <input type="number" id="sim-at" inputmode="numeric" min="15" max="40" placeholder="for example 21">
      </label>
      <label class="now-only">Age
        <span class="ages">
          <input type="number" id="sim-age-min" inputmode="numeric" min="14" max="46" placeholder="from">
          <input type="number" id="sim-age-max" inputmode="numeric" min="14" max="46" placeholder="to">
        </span>
      </label>
      <label class="now-only">League <select id="sim-league"></select></label>
      <label class="now-only">Ability from
        <input type="number" id="sim-ability" inputmode="numeric" min="0" max="100" placeholder="percentile">
      </label>
    </div>
    <div class="suggest" id="sim-suggest"></div>
    <p class="status" id="sim-status" aria-live="polite"></p>
    <div id="sim-out"></div>
    <p class="note" id="sim-note"></p>
  </section>

  <section id="greats" hidden>
    <p class="label" id="gr-label"></p>
    <div class="controls">
      <label>Great <select id="gr-name"></select></label>
      <label class="search">At age <select id="gr-age"></select></label>
      <div class="checks"><label><input type="checkbox" id="gr-pool"> Elite pool only</label></div>
    </div>
    <p class="status" id="gr-status" aria-live="polite"></p>
    <div id="gr-out"></div>
    <p class="note" id="gr-note"></p>
    <p class="note credit" id="gr-credit"></p>
  </section>

  <section id="archetypes" hidden>
    <p class="label" id="ar-label"></p>
    <div class="controls">
      <label>Archetype <select id="ar-name"></select></label>
      <label>Age today
        <span class="ages">
          <input type="number" id="ar-age-min" inputmode="numeric" min="14" max="46" placeholder="from">
          <input type="number" id="ar-age-max" inputmode="numeric" min="14" max="46" placeholder="to">
        </span>
      </label>
      <div class="checks"><label><input type="checkbox" id="ar-pool"> Elite pool only</label></div>
    </div>
    <p class="note" id="ar-verdict"></p>
    <p class="status" id="ar-status" aria-live="polite"></p>
    <div id="ar-out"></div>
    <div id="ar-card"></div>
    <p class="note" id="ar-note"></p>
  </section>

  <section id="ask" hidden>
    <div class="welcome">
      <h2>Ask about the players</h2>
      <p id="ask-knows"></p>
      <p id="ask-not"></p>
    </div>
    <div class="chips" id="ask-suggest" aria-label="Suggested questions"></div>
    <p class="label">Answers are built only from the tables shown on this page.</p>
    <p class="ask-line" id="ask-line"></p>
    <div id="ask-log" aria-live="polite"></div>
    <p class="status" id="ask-status" aria-live="polite"></p>
    <form id="ask-form">
      <textarea id="ask-q" maxlength="500" placeholder="for example: who is the youngest centre back with an elite chance of 30%?" aria-label="Your question"></textarea>
      <button type="submit" id="ask-send">Ask</button>
      <span id="ask-count">0 / 500</span>
    </form>
  </section>

  <footer id="footer"></footer>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var PAGE = 50;

  // Data

  function fold(s) {
    return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
      .replace(/ı/g, "i").replace(/ø/g, "o").replace(/æ/g, "ae").replace(/ß/g, "ss")
      .replace(/đ/g, "d").replace(/ł/g, "l");
  }
  function rows(table) {
    return table.rows.map(function (r, i) {
      var o = { _i: i };
      table.columns.forEach(function (c, j) { o[c] = r[j]; });
      o._q = fold(o.player + " " + o.club_at_forecast + " " + (o.current_club || ""));
      return o;
    });
  }
  var DATA = { candidates: rows(D.candidates), bargains: rows(D.bargains) };

  // Formatting

  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August",
    "September", "October", "November", "December"];
  function day(iso) {
    if (!iso) return "";
    var p = iso.split("-");
    return Number(p[2]) + " " + MONTHS[Number(p[1]) - 1] + " " + p[0];
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function money(v) {
    if (v == null) return '<span class="blank">no value</span>';

    }
    if (legend) add("How far can I trust an archetype?");
    else if (league && table && table.indexOf("bargains") === 0) add("Who has the best step up chance " + inLeague(league) + "?");
    else if (league) add("Show me bargains " + inLeague(league));
    else if (label) add("How rough is a comparison across eras?");
    return out;
  }
  function paragraphs(text) {
    return String(text).split(/\n{2,}/).map(function (p) {
      return "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>";
    }).join("");
  }
  function plain(v) {
    if (v == null) return "none";
    if (Array.isArray(v)) return v.map(plain).join("; ");
    if (typeof v === "object") return Object.keys(v).map(function (k) { return k.replace(/_/g, " ") + " " + plain(v[k]); }).join(", ");
    return String(v);
  }
  function compact(o) {
    return Object.keys(o).filter(function (k) { return k !== "player_id"; }).map(function (k) {
      return '<span class="k">' + esc(k.replace(/_/g, " ")) + "</span> " + esc(plain(o[k]));
    }).join(" · ");
  }
  function result(o) {
    var html = Object.keys(o).filter(function (k) { return k !== "player_id"; }).map(function (k) {
      var v = o[k];
      if (Array.isArray(v) && v.length && v[0] && typeof v[0] === "object") {
        return "<dt>" + esc(k.replace(/_/g, " ")) + "</dt><dd><ol>" + v.map(function (r) { return "<li>" + compact(r) + "</li>"; }).join("") + "</ol></dd>";
      }
      if (v && typeof v === "object" && !Array.isArray(v)) return "<dt>" + esc(k.replace(/_/g, " ")) + "</dt><dd>" + compact(v) + "</dd>";
      return "<dt>" + esc(k.replace(/_/g, " ")) + "</dt><dd>" + esc(plain(v)) + "</dd>";
    }).join("");
    return '<dl class="kv">' + html + "</dl>";
  }
  function fromTables(results) {
    if (!results || !results.length) return "";
    return '<details class="from"><summary>From the tables (' + results.length + " look up" + (results.length > 1 ? "s" : "") + ")</summary>" +
      results.map(function (r) {
        return "<h4>" + esc(r.tool.replace(/_/g, " ")) + '</h4><p class="args">' + esc(plain(r.input)) + "</p>" + result(r.result);
      }).join("") + "</details>";
  }
  function say(who, html, cls) {
    $("ask-log").insertAdjacentHTML("beforeend", '<div class="msg ' + (cls || "") + '"><div class="who">' + esc(who) + "</div>" + html + "</div>");
  }
  function sendQuestion(e) {
    e.preventDefault();
    ask($("ask-q").value.trim());
  }
  function ask(q) {
    if (!q || chat.busy || !(D.chat && D.chat.url)) return;
    if (q.length > D.chat.max_chars) { $("ask-status").textContent = "Please keep your question under " + D.chat.max_chars + " characters."; return; }
    chat.busy = true;
    busy(true);
    document.querySelectorAll("#ask-log .follow").forEach(function (b) { b.remove(); });
    $("ask-status").textContent = "Looking it up in the tables.";
    var slow = setTimeout(function () {
      $("ask-status").textContent = "Looking it up in the tables. The first answer can take up to 30 seconds.";
    }, SLOW_MS);
    say("You", paragraphs(q), "you");
    $("ask-q").value = "";
    $("ask-count").textContent = "0 / " + D.chat.max_chars;
    var past = chat.history.slice(-TURNS);
    fetch(D.chat.url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ message: q, history: past })
    }).then(function (r) {
      if (r.status === 429) throw new Error("busy");
      return r.json();
    }).then(function (b) {
      clearTimeout(slow);
      var answered = b.outcome === "answered";
      var next = answered ? followUps(b.tool_results, q) : [];
      var follow = next.length ? '<div class="chips follow" aria-label="Ask next">' + next.map(function (x) {
        return '<button type="button" data-q="' + esc(x) + '">' + esc(x) + "</button>";
      }).join("") + "</div>" : "";
      say("Answer", paragraphs(b.answer || "Sorry, no answer came back.") + fromTables(b.tool_results) + follow, answered ? "" : "capped");
      if (answered) chat.history.push({ role: "user", content: q }, { role: "assistant", content: b.answer });
      $("ask-status").textContent = "";
    }).catch(function (err) {
      clearTimeout(slow);
      say("Answer", paragraphs(err && err.message === "busy" ? "The chat is busy with other questions; please try again in a minute." : "The chat could not be reached; please try again in a minute."), "capped");
      $("ask-status").textContent = "";
    }).then(function () {
      chat.busy = false;
      busy(false);
    });
  }
  function busy(on) {
    $("ask-send").disabled = on;
    document.querySelectorAll("#ask .chips button").forEach(function (b) { b.disabled = on; });
  }

  // The fixed text

  function howto() {
    var w = D.window, pool = D.elite_pool, dates = Object.keys(D.feature_dates).sort();
    var main = dates[dates.length - 1], other = dates.slice(0, -1);
    var when = "Players are described as they stood on " + day(main) + ", at the end of the " + D.season_label + " season" + (other.length ? other.map(function (d) {
      return " (on " + day(d) + " in the " + words(D.feature_dates[d].length) + " calendar year leagues, at the end of their " + D.season + " season: " + D.feature_dates[d].map(esc).join(", ") + ")";
    }).join("") : "") + ".";
    var reg = D.forecasts.length ? " The forecast of record was registered on " + day(D.forecasts[0].date) +
      (D.forecasts[0].revisions ? " (revised " + times(D.forecasts[0].revisions) + " the same day, each change recorded)" : "") +
      "; it is scored once " + words(D.horizon) + " seasons have passed." : "";
    var fb = D.fall_back.map(function (b) {
      return (b.flags === "1" ? "1 flag " : b.flags + " flags ") + b.pct + "% (of " + int(b.players) + ")";
    }).join(", ");
    var items = [
      "<b>Calibrated odds from past seasons, not predictions beyond the market.</b> Every chance is what actually happened before: of the players that past forecasts, rebuilt with the models of their time, put in the same bucket, the share who did it within " + words(D.horizon) + " seasons. The small number under it is how many past players it rests on. Rates are rounded to the nearest 5% and never shown for fewer than 30 players.",
      "<b>A " + words(w.seasons) + " season window.</b> The rates pool the last " + words(w.seasons) + " scored seasons, " + w.first + " to " + w.last + ", so they follow recent seasons rather than the whole history.",
      "<b>The market already knows most of it.</b> Among young players the elite model is barely better than a simple rule from value rank and age, so read a high elite chance as the market's own view, measured honestly. What these tables add is calibrated odds, risk flags with each player's own numbers, and the same treatment for all " + D.tracked + " leagues tracked.",
      "<b>Valuation date.</b> Market values are Transfermarkt valuations up to " + day(D.valuation_end) + (D.latest_value_date ? " (the latest used is dated " + day(D.latest_value_date) + ")" : "") + ". The source has published nothing newer, so values stay frozen there until a new source is added.",
      "<b>Forecast date.</b> " + when + " These tables were built on " + day(D.built) + "." + reg,
      "<b>Blank chances.</b> Elite chance and fall back risk exist only for the elite pool (ranked #" + pool.from + " to #" + int(pool.to) + " by value and " + pool.max_age + " or under). Big move is blank at a top 20 club. Rising players valued below #2,000 are added without chances.",
      "<b>Club today and season so far" + (D.so_far_date ? ", as of " + day(D.so_far_date) : "") + ".</b> The club is the one whose squad lists him on that day; Moved means it is not the club the forecast describes. The season so far column reads the league matches of the season in progress up to that day: minutes, share of team minutes, the one season ability percentile (stored fit, among regulars with 450 minutes or more), goals and assists per 90 (not for goalkeepers and centre backs, nor under 270 minutes) and the flags as they stand today. It is context for the forecast, which stays as registered.",
      "<b>Flags</b> are low minutes, injured and value falling, each shown with the player's own number. Fall back risk in the elite pool by flags: " + fb + ".",
      "<b>Bargains</b> are regular players (half of team minutes or more, ability at the 70th percentile of their position or better) whose market value is low against the fair value model, which was trained on earlier seasons only. Prime is 29 and under, experienced 30 to 33."
    ];
    var R = D.reports;
    if (R && R.available) {
      var agree = R.agreement ? " The owner read " + int(R.agreement.read) + " of the judge's verdicts and agreed with " + int(R.agreement.agreed) + " (" + Math.round(100 * R.agreement.agreed / R.agreement.read) + "%)." : "";
      items.push("<b>Written reports.</b> Each player's panel (Report and similar players) has a report of about 130 words that " + esc(R.writer) + " writes from the row's facts. Code checks that every number and every name in it is among those facts; a report that still fails after two rewrites is replaced by the explanation written by rule (" + int(R.written) + " written, " + int(R.template) + " by rule this week). It describes the forecast and his club today; the season so far is shown under it as its own block, so a new match never rewrites it. Its odds are historical rates, like everywhere on this page. Each week " + esc(R.judge) + " grades a sample for faithfulness, hedging and readability: " + int(R.judge_faithful) + " of the " + int(R.judged) + " graded so far were faithful." + agree);
    }
    $("howto-list").innerHTML = items.map(function (t) { return "<li>" + t + "</li>"; }).join("");
  }

  function header() {
    $("subtitle").textContent = "Season " + D.season_label + ", players from " + D.leagues + " of the " + D.tracked + " leagues tracked, built " + day(D.built) + ".";
    $("tab-candidates").querySelector(".n").textContent = DATA.candidates.length.toLocaleString("en");
    $("tab-bargains").querySelector(".n").textContent = DATA.bargains.length.toLocaleString("en");
    document.querySelectorAll("#lists button").forEach(function (b) {
      b.querySelector(".n").textContent = DATA.bargains.filter(function (o) { return o.list === b.dataset.list; }).length.toLocaleString("en");
    });
    $("footer").innerHTML =
      "<p>Downloads: <a href=\"data/candidates.csv\">candidates.csv</a>, <a href=\"data/bargains.csv\">bargains.csv</a>, " +
      "<a href=\"data/dictionary.csv\">dictionary.csv</a>; the same tables as Parquet: <a href=\"data/candidates.parquet\">candidates</a>, " +
      "<a href=\"data/bargains.parquet\">bargains</a>.</p>" +
      "<p>Sources: player statistics from API Football (api-football.com), used under the owner's subscription; raw responses are not published. " +
      "Market values and transfers from transfermarkt-datasets by dcaribou (github.com/dcaribou/transfermarkt-datasets), derived from Transfermarkt (transfermarkt.com), used for non commercial purposes only and credited here. No club logos or photos are stored or shown.</p>" +
      (D.greats ? '<p><img class="logo" src="statsbomb-logo.png" alt="StatsBomb">The Measured greats tab uses StatsBomb open data (github.com/statsbomb/open-data) for seasons before 2015/16, for non commercial use with attribution; only results computed from it are shown, never the data.</p>' : "") +
      "<p>A non commercial project. Every chance is a historical rate with its count, not a promise about a single player.</p>";
  }

  // Wiring

  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () {
      if (t.dataset.tab === "similar") { openSimilar(); return; }
      if (t.dataset.tab === "greats") { openGreats(); return; }
      if (t.dataset.tab === "archetypes") { openArchetypes(); return; }
      if (t.dataset.tab === "ask") { openAsk(); return; }
      state.ask = false;
      state.similar = false;
      state.greats = false;
      state.archetypes = false;
      state.tab = t.dataset.tab;
      history.replaceState(null, "", state.tab === "bargains" ? "#bargains" : "#candidates");
      ["q", "age-min", "age-max"].forEach(function (id) { $(id).value = ""; });
      state.shown = PAGE;
      setupTab();
      draw();
    });
  });
  document.querySelectorAll("#lists button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.list = b.dataset.list;
      document.querySelectorAll("#lists button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      refresh();
    });
  });
  ["position", "league", "flag"].forEach(function (id) { $(id).addEventListener("change", refresh); });
  ["q", "age-min", "age-max"].forEach(function (id) { $(id).addEventListener("input", refresh); });
  $("sort").addEventListener("change", function () { sortBy($("sort").value, false); });
  $("dir").addEventListener("click", function () {
    state.sort[state.tab].dir = -state.sort[state.tab].dir; state.shown = PAGE; head(); draw();
  });
  $("reset").addEventListener("click", function () {
    ["q", "age-min", "age-max"].forEach(function (id) { $(id).value = ""; });
    ["position", "league", "flag"].forEach(function (id) { $(id).value = ""; });
    document.querySelectorAll("#checks input").forEach(function (i) { i.checked = false; });
    state.sort[state.tab] = { key: DEFAULT_SORT[state.tab], dir: 1 };
    head(); refresh();
  });
  $("more").addEventListener("click", function () { state.shown += PAGE; draw(); });
  $("table").addEventListener("click", function (e) {
    var open = e.target.closest(".sim-open"), more = e.target.closest(".sim-more");
    if (open) togglePanel(open);
    if (more) { openSimilar(Number(more.dataset.id)); window.scrollTo(0, 0); }
  });
  document.querySelectorAll("#sim-mode button").forEach(function (b) {
    b.addEventListener("click", function () { sim.mode = b.dataset.mode; suggest(); simDraw(); });
  });
  $("sim-q").addEventListener("input", function () { suggest(); });
  $("sim-q").addEventListener("keydown", function (e) {
    var first = $("sim-suggest").querySelector("button");
    if (e.key === "Enter" && first) { e.preventDefault(); pick(Number(first.dataset.id)); }
  });
  $("sim-suggest").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b) pick(Number(b.dataset.id));
  });
  ["sim-at", "sim-age-min", "sim-age-max", "sim-ability"].forEach(function (id) { $(id).addEventListener("input", simDraw); });
  $("sim-league").addEventListener("change", simDraw);
  $("gr-name").addEventListener("change", function () { gr.name = $("gr-name").value; greatAgeOptions(); greatsDraw(); });
  $("gr-age").addEventListener("change", function () { gr.age = Number($("gr-age").value); greatsDraw(); });
  $("gr-pool").addEventListener("change", greatsDraw);
  $("ar-name").addEventListener("change", function () { ar.key = $("ar-name").value; arDraw(); });
  ["ar-age-min", "ar-age-max"].forEach(function (id) { $(id).addEventListener("input", arDraw); });
  $("ar-pool").addEventListener("change", arDraw);
  $("ask-form").addEventListener("submit", sendQuestion);
  $("ask").addEventListener("click", function (e) {
    var b = e.target.closest(".chips button");
    if (b && !b.disabled) ask(b.dataset.q);
  });
  $("ask-q").addEventListener("input", function () { $("ask-count").textContent = $("ask-q").value.length + " / " + ((D.chat && D.chat.max_chars) || 500); });
  $("ask-q").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) sendQuestion(e);
  });

  header();
  howto();
  if (window.matchMedia && window.matchMedia("(max-width: 760px)").matches) $("howto").open = false;
  document.querySelector('#lists button[data-list="prime"]').setAttribute("aria-pressed", "true");
  document.querySelector('#lists button[data-list="experienced"]').setAttribute("aria-pressed", "false");
  setupTab();
  draw();
  if (state.similar) openSimilar();
  if (state.greats) openGreats();
  if (state.archetypes) openArchetypes();
  if (state.ask) openAsk();
})();
</script>
</body>
</html>
