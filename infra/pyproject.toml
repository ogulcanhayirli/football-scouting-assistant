[project]
name = "scout-infra"
version = "0.1.0"
description = "AWS CDK stacks for the football scouting assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-cdk-lib>=2.272.0",
    "constructs>=10",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
