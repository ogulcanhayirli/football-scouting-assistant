[project]
name = "scout"
version = "0.1.0"
description = "Football scouting assistant: fair value, value growth and similarity search for the Premier League and the Süper Lig"
readme = "README.md"
authors = [{ name = "Ogulcan Hayirli" }]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
scout = "scout.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "contract: data contract tests on the committed sample",
    "live: tests that call real external APIs (never run in CI)",
]
